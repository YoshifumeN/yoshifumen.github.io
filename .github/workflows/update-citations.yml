name: Update citation counts

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 1"

# Read-only by default. Only the update job may create the review PR.
permissions:
  contents: read

concurrency:
  group: citation-count-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test citation update safety without external API calls
        run: python -m unittest discover -s tests -p 'test_update_citations.py' -v

      - name: Fetch and validate citation counts
        run: python scripts/update_citations.py
        # HTTP 429 and other fetch errors fail the job without overwriting old counts.

      - name: Create reviewable citation update PR (never push to main)
        id: citation_pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            publications.html
            data/citations.json
          base: main
          branch: automation/citation-counts
          delete-branch: true
          draft: true
          commit-message: "Update Semantic Scholar citation counts"
          title: "Update publication citation counts (Semantic Scholar)"
          body: |
            Automated citation count refresh from Semantic Scholar.

            Only `publications.html` and `data/citations.json` are changed.
            Review counts and dates before merging. This PR does not auto-merge.

            The update workflow was tested before generating this PR.

      - name: Report outcome
        env:
          PR_URL: ${{ steps.citation_pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Review the citation update PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No citation-data changes; no PR required." >> "$GITHUB_STEP_SUMMARY"
          fi
