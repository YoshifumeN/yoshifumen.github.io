name: Update citation counts

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 1"

# Read-only by default. Only the citation job can write its PR and request a Pages build.
permissions:
  contents: read

concurrency:
  group: citation-count-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test citation update safety without external API calls
        run: python -m unittest discover -s tests -p 'test_update_citations.py' -v

      - name: Fetch and validate citation counts
        run: python scripts/update_citations.py
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        # HTTP 429 and other fetch errors fail the job without overwriting old counts.

      - name: Create citation-only update PR
        # A manual run on a feature branch is a safe end-to-end test: no PR or publication.
        if: github.ref == 'refs/heads/main'
        id: citation_pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            publications.html
            data/citations.json
          base: main
          branch: automation/citation-counts
          delete-branch: true
          draft: false
          commit-message: "Update OpenAlex citation counts"
          title: "Update publication citation counts (OpenAlex)"
          body: |
            Automated citation count refresh from OpenAlex.

            Only `publications.html` and `data/citations.json` are changed.
            The updater's offline safety tests and complete DOI validation must pass
            before this PR is created and automatically squash-merged.

            A failure leaves existing published citation counts unchanged.

      - name: Merge the validated citation update PR
        if: github.ref == 'refs/heads/main' && steps.citation_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.citation_pr.outputs.pull-request-number }}
        run: |
          # If branch protections prevent the merge, fail safely and keep the PR for review.
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Request GitHub Pages build from merged main
        if: github.ref == 'refs/heads/main' && steps.citation_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A GITHUB_TOKEN merge does not by itself trigger a Pages branch-source build.
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages/builds" --silent

      - name: Report outcome
        env:
          PR_URL: ${{ steps.citation_pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Merged the validated citation update PR and requested a Pages build: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No citation-data changes; no PR required." >> "$GITHUB_STEP_SUMMARY"
          fi
