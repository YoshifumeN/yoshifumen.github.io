name: Site-wide security regression

on:
  pull_request:
    paths:
      - '*.html'
      - 'tests/site-smoke.cjs'
      - '.github/workflows/site-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test static pages and site CSP
        run: node tests/site-smoke.cjs
