name: Public media metadata audit

on:
  pull_request:
    paths:
      - 'tests/public-metadata-audit.py'
      - '.github/workflows/public-metadata-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Inspect metadata without showing contents
        run: python tests/public-metadata-audit.py
