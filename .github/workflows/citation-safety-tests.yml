name: Citation updater safety tests

on:
  pull_request:
    paths:
      - 'scripts/update_citations.py'
      - 'tests/test_update_citations.py'
      - '.github/workflows/citation-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test retry and failure isolation without contacting API
        run: python -m unittest discover -s tests -p 'test_update_citations.py' -v
