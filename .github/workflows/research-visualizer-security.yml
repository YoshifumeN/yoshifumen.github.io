name: Research Visualizer security regression

on:
  pull_request:
    paths:
      - 'research-visualizer.html'
      - 'tests/**'
      - '.github/workflows/research-visualizer-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare test fixtures
        run: python tests/create_test_xlsx.py
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test exports, imports, SVG sanitizer, and content policy
        run: node tests/security-smoke.cjs
