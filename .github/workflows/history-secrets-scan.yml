name: Historical secrets scan

on:
  pull_request:
    paths:
      - '.github/workflows/history-secrets-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          chmod +x /tmp/gitleaks-bin/gitleaks
      - name: Check full Git history without revealing secrets
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /tmp/gitleaks-bin/gitleaks git --no-banner --redact=100 \
            --log-opts='--all' --report-format json --report-path /tmp/history-findings.json \
            . > /tmp/gitleaks-history-output.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo 'Historical scan could not complete normally; no raw scanner log is displayed.'
            exit 2
          fi
          if [ "$rc" -eq 1 ]; then
            echo 'Potential historical secrets detected. Investigate privately; do not print raw findings.'
            exit 1
          fi
          echo 'PASS: no historical secret findings detected by Gitleaks in reachable Git history.'
      - name: Check current repository tree without revealing secrets
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /tmp/gitleaks-bin/gitleaks dir --no-banner --redact=100 \
            --report-format json --report-path /tmp/current-findings.json \
            . > /tmp/gitleaks-current-output.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo 'Potential secrets in current repository files. Investigate privately.'
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo 'Current tree scan did not complete normally.'
            exit 2
          fi
          echo 'PASS: no current-tree secret findings detected by Gitleaks.'
