name: Apply and test Curry Records CSP on review branch

on:
  push:
    branches:
      - security/curry-csp-20261028
    paths:
      - 'tools/harden-curry-record.cjs'
      - 'tests/curry-csp-smoke.cjs'
      - '.github/workflows/curry-csp-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/security/curry-csp-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal CSP patch to Curry Records
        run: node tools/harden-curry-record.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser regression test
        run: node tests/curry-csp-smoke.cjs
      - name: Commit reviewed HTML change to this branch only
        run: |
          if ! git diff --quiet -- curry-record.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- curry-record.html
            git commit -m "Apply hash-based CSP to Curry Records"
            git push origin HEAD:security/curry-csp-20261028
          else
            echo "CSP already applied; no HTML change"
          fi
