name: Repository exposure audit

on:
  pull_request:
    paths:
      - 'tests/repository-exposure-audit.cjs'
      - '.github/workflows/repository-exposure-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Audit tracked files and all reachable historical paths
        run: node tests/repository-exposure-audit.cjs
